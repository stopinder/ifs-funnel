<!DOCTYPE html>
<html lang="en-GB">
<head>
        <meta charset="UTF-8" />
        <meta
                name="viewport"
                content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <meta name="robots" content="index, follow" />
        <meta name="rating" content="general" />
        <meta name="author" content="Robert Ormiston" />

        <title>IFS & EMDR-Informed Psychotherapy Online · Robert Ormiston MBACP</title>

        <meta
                name="description"
                content="Brief, trauma-aware Internal Family Systems (IFS) and EMDR-informed psychotherapy online with Robert Ormiston (MBACP). Calm, structured sessions with optional reflective summaries to support integration between sessions."
        />

        <!-- Fonts: Inter (UI copy) + Lora (serif headings) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <!-- Preload font CSS for faster first paint -->
        <link
                rel="preload"
                as="style"
                href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@400;600&display=swap"
        />
        <link
                href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@400;600&display=swap"
                rel="stylesheet"
        />

        <!-- Preload a key brand image (swap to .webp/.avif later if you generate one) -->
        <link rel="preload" as="image" href="/images/ChrysalisLogo.svg" />

        <!-- Favicons / app icons -->
        <link
                rel="apple-touch-icon"
                sizes="180x180"
                href="/apple-touch-icon.png"
        />
        <link
                rel="icon"
                type="image/png"
                sizes="32x32"
                href="/favicon-32x32.png"
        />
        <link
                rel="icon"
                type="image/png"
                sizes="16x16"
                href="/favicon-16x16.png"
        />
    <link rel="canonical" href="https://www.robormiston.com/" />

    <link
                rel="icon"
                href="/favicon.ico"
                type="image/x-icon"
        />
        <meta name="theme-color" content="#0d9488" />

        <!-- Open Graph / social preview (used by LinkedIn, iMessage, etc.) -->
        <meta
                property="og:title"
                content="IFS & EMDR-Informed Psychotherapy · Robert Ormiston MBACP"
        />
        <meta
                property="og:description"
                content="Calm, focused psychotherapy for clinicians, carers, and long-term seekers. Internal Family Systems (IFS) blended with reflective written integration between sessions."
        />
        <meta property="og:image" content="/images/social-card.jpg" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://www.robormiston.com/" />

        <!-- Twitter Card (used when someone posts your site on X/Twitter/Slack/etc.) -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta
                name="twitter:title"
                content="Chrysalis Therapy · Robert Ormiston MBACP"
        />
        <meta
                name="twitter:description"
                content="Brief, integrative IFS work with reflective support. Safe, regulated, and clinically grounded."
        />
        <meta name="twitter:image" content="/images/social-card.jpg" />

        <!-- Structured data / schema.org - tells Google you're a real clinician -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "Person",
                "name": "Robert Ormiston",
                "jobTitle": "Psychotherapist, MBACP",
                "description": "Integrative psychotherapist offering Internal Family Systems (IFS) and EMDR-informed psychotherapy with reflective integration support.",
                "url": "https://www.robormiston.com/",
                "image": "https://www.robormiston.com/images/ChrysalisLogo.svg",
                "worksFor": {
                    "@type": "Organization",
                    "name": "Chrysalis Therapy",
                    "url": "https://www.robormiston.com/",
                    "logo": "https://www.robormiston.com/images/ChrysalisLogo.svg"
                },
                "memberOf": {
                    "@type": "Organization",
                    "name": "British Association for Counselling and Psychotherapy"
                },
                "sameAs": [
                    "https://www.linkedin.com/in/robertormiston/",
                    "https://www.bacp.co.uk"
                ],
                "knowsAbout": [
                    "Internal Family Systems (IFS)",
                    "EMDR-informed practice",
                    "Trauma recovery",
                    "Brief integrative therapy",
                    "Reflective summaries between sessions"
                ]
            }
        </script>

        <!-- Vite entry (this boots your Vue app) -->
        <script type="module" src="/src/main.js"></script>
    </head>


<body class="bg-surface text-textsurface">

</body>
</html>
